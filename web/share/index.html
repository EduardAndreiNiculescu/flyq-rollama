<!doctype html>
<html lang="ro">

<title>FlyQ · zbor partajat</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css">
<style>

  .apill { display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:6px 14px 6px 6px; box-shadow:0 6px 18px rgba(2,132,199,.28), 0 1px 3px rgba(0,0,0,.08); white-space:nowrap; }

    <div class="right"><div class="code" id="to">---</div><div class="city" id="toCity"></div></div>
  </div>
  <div class="times"><span id="tFrom">–</span><span id="tTo">–</span></div>
  <div class="meta">

</div>

<div id="bottom" class="card"><span id="foot"></span></div>

  function demoData() {
    var a = { code: 'CRA', city: 'Craiova', lat: null, lon: null }, b = { code: 'LTN', city: 'Londra Luton', lat: null, lon: null }; // null on purpose: the page must draw with its own table
    var pts = gcPoints(AIRPORTS.CRA, AIRPORTS.LTN, 96), cycle = 240, f = ((Date.now() / 1000) % cycle) / cycle, i = Math.min(95, Math.floor(f * 96)), p = pts[i], q = pts[i + 1];
    return { flightNumber: 'W69901', demo: true, from: a, to: b, status: 'in_air', gate: '3', scheduledDeparture: '2026-11-01T10:40:00+02:00', scheduledArrival: '2026-11-01T11:50:00+00:00', progress: f,
      eta: { epoch: Date.now() / 1000 + (1 - f) * 8700, kind: 'demo' }, position: { lat: p[1], lon: p[0], headingDeg: bearing(p, q), altitudeM: 10600, groundSpeedMps: 230 }, updatedAt: Date.now() / 1000 };
  }
  // The server may send null coordinates; the codes are enough (the page has its own table), so only the codes are required.
  function parse(j) { return j && j.from && j.to && typeof j.from.code === 'string' && typeof j.to.code === 'string' ? j : null; }
  function poll() {
    if (stop) return;
    if (demoMode) { render(demoData()); return; }
    if (!token) { ended(T.badLink, T.badBody); return; }
    fetch(apiBase + '/v1/public/shares/' + encodeURIComponent(token), { headers: { accept: 'application/json' }, cache: 'no-store', credentials: 'omit', referrerPolicy: 'strict-origin-when-cross-origin' })
      .then(function (r) {
        if (r.status === 404 || r.status === 410) { ended(T.ended, T.endedBody); return null; }
        if (r.status === 429) return null; // slow down: next tick
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (j) { if (j === null || stop) return; var d = parse(j); if (d) render(d); })
      .catch(function () { $('foot').textContent = T.offline; });
  }
  initMap();
  poll();
  setInterval(function () { if (!document.hidden) poll(); }, demoMode ? 2000 : POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
